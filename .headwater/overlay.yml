# The vendkit adopter overlay (DR-0021).
#
# An overlay is add-only over the package: nothing here weakens a base rule.
# What it states is what no tree answers — what a task routes to, what an
# identifier looks like here, and where this corpus keeps its two shelves.

override:
  # --- INTERVIEW 1: what does each purpose answer? ---------------------------
  # The package's three phrases, kept verbatim, plus the two a contributor here
  # would actually type. `answers` is a whole value and the package states one,
  # so this is an override that extends rather than an add.
  purposes.rationale.answers:
    - why is it this way
    - what was rejected
    - what does this constrain
    - which DR covers this
    - why not that alternative

  # --- INTERVIEW 2: what identifies a document? ------------------------------
  # vendkit mints bare `DR-NNNN` and has done since DR-0001; the identifier
  # travels in commit messages, issues and the manifest, so the corpus takes
  # the pattern the corpus already wrote rather than renaming 20 records to
  # suit a namespaced default. The base pattern leads with `{namespace}` and
  # this corpus has none, so the pattern is overridden rather than the
  # namespace filled in.
  identifier_schemes.decision_id:
    pattern: "DR-{seq:04d}"
    namespace: VK
    allocation: reconcile-first

  # The package declares one `shelf_index` projection over its own two shelves.
  # `projections` is a list, so naming a third shelf means restating the whole
  # value; the two package entries are kept verbatim and `specs` is appended.
  projections:
    - {kind: shelf_index, for: [decisions, specifications, specs], output: "{shelf}/README.md"}

  # --- INTERVIEW 3: where is the shelf? --------------------------------------
  # This repository has kept design records at `docs/design/` since DR-0001,
  # and the file name carries the `DR-` prefix. The pilot moves no files.
  shelves.decisions:
    path: docs/design/**
    homogeneous: true
    kind: decision
    layout: "DR-{seq:04d}-{slug}.md"
    title: Design records

add:
  # The component specifications have lived at `docs/specs/` since before the
  # ladder existed, so a shelf moves to the files rather than the files to a
  # shelf. It is a new shelf and not an override of the package's
  # `component_specs`: a bundle states that one with `add`, and an overlay
  # `override` over a bundle `add` does not commute, so the package's shelf
  # stays where it is and this corpus declares its own beside it.
  #
  # Heterogeneous and discriminated by `spec_layer`, which is the package's own
  # shape for a shelf holding both rungs: a reader opens one directory and the
  # facet says which layer each document is.
  shelves.specs:
    path: docs/specs/**
    homogeneous: false
    discriminator: spec_layer
    kinds: [functional_spec, technical_spec]
    title: Component specifications

  identifier_schemes.obligation_record_id.namespace: VK
  identifier_schemes.standard_id.namespace: VK
  identifier_schemes.functional_spec_id.namespace: VK
  identifier_schemes.technical_spec_id.namespace: VK
