# The consumer declaration for the Headwater docs-governance adoption (DR-0021).
#
# The corpus is the repository, not `docs/`, because the compatibility policy
# is a governed standard and conventionally lives at the root where GitHub
# surfaces it. Widening the root means every shelf and exclusion path is
# written `./`-prefixed, which is what the census walks.
#
# Three shelves are governed: the design records, the component specifications
# split into functional and technical layers by the `spec_layer` facet, and the
# standards that regulate them.
#
# `internal/docsgen` still renders the site (DR-0018); Headwater types and
# checks these shelves and generates their indexes, and is never linked into
# `cmd/vendkit`.
#
# `headwater taxonomy resolve` reads this and writes .headwater/taxonomy.lock.
# Everything after that reads the lock and never these sources.

taxonomy:
  package: headwater/standard
  version: 4.2.0
  digest: sha256:961ecf2ae2c3c74f251adea575d16b2efda37d9a7fb10d2889e12bb77f4c2eb5
  bundles: [decision-record, evidence-and-obligation, standards-spec]
  overlay: .headwater/overlay.yml

corpus:
  root: .
  exclude:
    - path: ./packages/**
      reason: the vendored taxonomy package's own prose, written by its publisher and admitted against a digest; this corpus does not own it and may not edit it
    - path: ./docs/design/README.md
      reason: the generated shelf index, a projection of the shelf and not a member of it
    - path: ./docs/design/TEMPLATE.md
      reason: the blank DR form, carrying placeholder headings and no decision
    - path: ./docs/specs/README.md
      reason: the generated shelf index, a projection of the shelf and not a member of it
    - path: ./docs/standards/README.md
      reason: the generated shelf index, a projection of the shelf and not a member of it
    - path: ./docs/architecture.md
      reason: a layering and orientation overview; it describes the whole system rather than one component, and no kind of this taxonomy fits it
    - path: ./README.md
      reason: the repository front page, a landing document whose job is to route a reader elsewhere
    - path: ./CONTRIBUTING.md
      reason: contributor process, which states how to work here rather than what the system does
    - path: ./ROADMAP.md
      reason: deferred work, whose future-tense voice every declarative regime in this package forbids
    - path: ./GLOSSARY.md
      reason: normative terminology; it defines the words the other documents use, and no kind of this package models a term list
    - path: ./SECURITY.md
      reason: the vulnerability-reporting policy, addressed to outside reporters rather than to this corpus
