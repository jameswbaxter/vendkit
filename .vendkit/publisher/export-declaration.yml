# VendKit's own export declaration — the framework is its own first publisher
# (architecture §4, self-hosting). Downstream publishers vendor this slice
# (scaffolds + core rules) and layer their content slices on top. The engine
# itself is not exported: it ships as a pinned, checksummed release artefact
# (DR-0016, DR-0020).
schema_version: 1

slice:
  name: vendkit
  title: "VendKit machinery"

publisher:
  scm: github
  repo: jameswbaxter/vendkit

include:
  - "conformance/core-rules.yml"
  - "scaffold/*/*.tmpl"
  - "LICENSE"

profiles:
  # One whole-surface profile until a real need appears.
  consumer: {}
